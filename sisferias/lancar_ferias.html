<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lançar Férias </title>
    <link type="text/css" rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
</head>

<body>
    <div class="container">
        <header>
            <nav id="menu"></nav>
        </header>
        <!--conteúdo da página -->
        <div class="conteudo">
            <div class="conteudo2">
                <div class="cabecalhoFerias">
                    <!-- cabecalho do corpo -->
                    <div class="quadro2">
                        <i class="material-icons" id="calendario">calendar_month</i>
                        <span id="tituloQuadro"> Lançar Férias </span>
                        <p> Janela de Planejamento</p>
                    </div>
                    <div class="ferias">
                        <p class="textoLancarFerias"> DIREITO </p>
                        <!-- Numero referente ao direito de férias (mutável conforme o mesmo) -->
                        <p class="valorLancarFerias" id="numeroDireito"> N </p>
                    </div>
                    <div>
                        <p class="textoLancarFerias"> PROGRAMADOS </p>
                        <!-- numero referente as ferias programadas (mutável conforme o mesmo) -->
                        <p class="valorLancarFerias" id="numeroProgramados"> N </p>
                    </div>
                    <div>
                        <p class="textoLancarFerias"> PARCELAS</p>
                        <!-- numero referente ao numero de Parcelas -->
                        <p class="valorLancarFerias" id="numeroParcelas"> N </p>

                    </div>
                </div>
                <section id="a1">
                    <div class="tabelaForms1">
                        <div class="cabecalhoForms1">
                            <h4> Dados do Militar</h4>
                            <hr>
                        </div>
                    </div>
                    <div class="conteudoMil">
                        <div class="campo-foto">
                            <!-- imagem -->
                            <label for="foto">Foto</label>

                            <input type="file" id="foto" accept="image/*">

                            <img id="preview" src="" alt="Pré-visualização da foto">

                            <div class="feriasRefAno">
                                <!-- ano de referencia das ferias -->
                                <label>Férias Referente ao Ano</label>
                                <select id="fériasRefAno" name="fériasRefAno">
                                    <option value="2025"> 2025</option>
                                    <option value="2026"> 2026</option>
                                    <option value="2027"> 2027</option>
                                    <option value="2028"> 2028</option>
                                    <option value="2029"> 2029</option>
                                    <option value="2030"> 2030</option>
                                </select>
                            </div>
                        </div>
                        <div class="qtdDireito">
                            <label>Quantidade de Dias de Direito</label>
                            <!-- mutável conforme a parcela  -->
                            <input type="number" min="0" max="100">
                        </div>
                        <!-- mutável conforme o login -->
                        <div class="nomePes">
                            <label>Nome Completo</label>
                            <input type="text" maxlength="100">
                        </div>
                        <div class="box1Lancar">
                            <div class="nomeGuerra">
                                <label>Nome de Guerra</label>
                                <input type="text">
                            </div>
                            <div class="nip">
                                <label>Nip</label>
                                <input type="text">
                            </div>
                            <!-- selecionado manualmente -->
                            <div class="setor">
                                <label>Setor</label>
                                <select id="setorSelect" name="setorSelect">
                                    <option value="01"> 01</option>
                                    <option value="02"> 02</option>
                                    <option value="10"> 10</option>
                                    <option value="13"> 13</option>
                                    <option value="14"> 14</option>
                                    <option value="20"> 20</option>
                                    <option value="30"> 30</option>
                                    <option value="40"> 40</option>
                                    <option value="50"> 50</option>
                                    <option value="60"> 60</option>
                                    <option value="70"> 70</option>
                                    <option value="outro"> outro </option>
                                    <option value="secom"> Secom </option>
                                    <option value="cadastro"> + Cadastrar novo setor </option>
                                </select>
                            </div>
                        </div>
                        <div class="box2Lancar">
                            <!-- selecionado manualmente -->
                            <div class="categoria">
                                <label>Categoria</label>
                                <select id="categoriaSelect" name="categoriaSelect">
                                    <option value="praca"> Praça</option>
                                    <option value="oficial">Oficial</option>
                                    <option value="servidorCivil"> Servidor Civil</option>
                                </select>
                            </div>
                            <div class="posto">
                                <!-- selecionado manualmente -->
                                <label>Posto/Graduação</label>
                                <select id="postoSelect" name="postoSelect">
                                    <option value="rc"> RC</option>
                                    <option value="mn">MN</option>
                                    <option value="cb"> CB</option>
                                    <option value="3sg"> 3 SG</option>
                                    <option value="2sg">2 SG</option>
                                    <option value="1sg"> 1 SG</option>
                                    <option value="so"> SO</option>
                                </select>
                            </div>
                            <div class="esp">
                                <label>esp.</label>
                                <input type="text">
                            </div>
                        </div>
                    </div>
                </section>
                <section id="a2">
                    <div class="tabelaFerias">
                        <div class="tabelaForms2">
                            <div class="cabecalhoForms2">
                                <!-- período de férias -->
                                <h4> Período de Férias (2026)</h4>
                                <div class="saldoRest">
                                    <p>Saldo Restante</p>
                                    <!-- mutável conforme o saldo de férias restante -->
                                    <p id="valorSaldoRest">30 dias</p>
                                    <hr>
                                </div>
                            </div>
                        </div>

                        <div class="feriasRefAno">
                            <br>
                            <!-- número de parcelas -->
                            <label>Dividir em quantas parcelas</label>
                            <select id="fériasRefAno" name="fériasRefAno">
                                <option value="1Parc"> 1 Parcela</option>
                                <option value="2Parc"> 2 Parcelas</option>
                                <option value="3Parc"> 3 Parcelas</option>
                                <option value="4Parc"> 4 Parcelas</option>
                            </select>
                        </div>
                        <!-- conforme as parcelas são selecionadas o tamalho de div parcelas AUMENTAM ou DIMINUEM -->
                        <div class="parcelas">
                            <div class="dataParc">
                                <h4>Parcelas</h4>
                                <p id="dataParct">0 dias</p>
                            </div>
                            <!-- data de início e fim -->
                            <div class="dataInFim">
                                <div>
                                    <label>Início</label>
                                    <input type="date" min="2025-01-01" max="2030-12-31">
                                </div>
                                <div>
                                    <label>Término</label>
                                    <input type="date" min="2025-01-01" max="2030-12-31">
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <!-- botão para seguir para a página de impressão -->
                <button type="button"> Próximo > </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
